[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscainsta"
version = "0.2.0"
description = "Local-first consented Instagram profile review MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
live = ["instagrapi>=3.2,<4"]

[project.scripts]
buscainsta = "buscainsta.cli:main"
buscainsta-pilot = "buscainsta.pilot:main"
buscainsta-dashboard = "buscainsta.dashboard:main"
buscainsta-radar = "buscainsta.radar.cli:main"
buscainsta-radar-server = "buscainsta.radar.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
buscainsta = ["static/*.html", "radar/static/*.html", "radar/static/*.js"]
