[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscainsta"
version = "0.2.0"
description = "Local-first consented Instagram profile review MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
buscainsta = "buscainsta.cli:main"
buscainsta-pilot = "buscainsta.pilot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
