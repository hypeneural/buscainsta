name: offline-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m buscainsta.cli sample --out data/synthetic.csv --count 100
      - run: python -m buscainsta.cli validate --input data/synthetic.csv --synthetic
