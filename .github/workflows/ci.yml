name: offline-tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check Radar frontend JavaScript syntax
        run: node --check src/buscainsta/radar/static/radar.js
      - name: Unit tests and CLI negative paths
        run: python -m pytest -q
      - name: Synthetic smoke test
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP "buscainsta-synthetic.csv"
          try {
            python -m buscainsta.cli doctor
            if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
            python -m buscainsta.cli sample --out $file --count 100
            if ($LASTEXITCODE -ne 0) { throw "generation failed" }
            $result = python -m buscainsta.cli validate --input $file --synthetic | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $result.total -ne 100 -or $result.valid -ne 100 -or $result.invalid -ne 0) { throw "validation failed" }
          } finally {
            if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
          }
      - name: Windows installer repeatability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "first Windows bootstrap failed" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-windows.ps1 -SkipInstall
          if ($LASTEXITCODE -ne 0) { throw "offline repeat failed" }
