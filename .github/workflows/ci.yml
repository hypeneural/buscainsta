name: offline-tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke test with temporary synthetic file
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP "buscainsta-synthetic.csv"
          python -m buscainsta.cli sample --out $file --count 100
          if ($LASTEXITCODE -ne 0) { throw "generation failed" }
          python -m buscainsta.cli validate --input $file --synthetic
          if ($LASTEXITCODE -ne 0) { throw "validation failed" }
          Remove-Item -LiteralPath $file -Force
